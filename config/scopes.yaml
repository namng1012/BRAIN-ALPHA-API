# Valid simulation scopes of the WorldQuant BRAIN API.
#
# Source: OPTIONS /simulations -> actions.POST.settings.children
# Fetched: 2026-10-22T09:14:00Z
#
# `instrumentType` is a platform constant ("EQUITY"), so the scope space is
# spanned by region / delay / universe only.
#
# This file is an ENUMERATION of every scope the platform accepts: 41 entries,
# one per legal (region, delay, universe) triple. Sampling a scope is therefore
# a single draw from `scopes` — every entry is legal by construction, so no
# post-draw validation is needed.
#
# The API publishes its settings as a nested tree (universe under region under
# delay), but the nesting is an artefact of the settings widget, not a
# dependency: the universe set of a region is identical for every delay that
# region supports (verified for all 11 regions). Flattening to the cross
# product therefore loses nothing.
#
# `ALL` region is excluded: it is not an equity market region but a size
# partition of the whole platform, and its universes (LARGE / MEDIUM / SMALL)
# are not usable universe names for any other region.
#
# A universe name is NOT globally unique (e.g. TOP3000 exists for both USA and
# GLB), so a scope must always be carried as the full triple.
#
# NOTE: this is a snapshot of a moving catalog. The platform may add scopes
# later; re-check the API before relying on the count.

counts:
  regions: 11
  delays: 2
  universes: 18
  valid_scope_combinations: 41

# Every legal scope. Keys are uniform so a draw is a dict lookup.
